name: CM Governance

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  required-files:
    name: Verify required operating-system files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required markdown files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "GOVERNANCE_RULES.md"
            "docs/00_GOVERNANCE/README.md"
            "docs/01_MASTER_BOUTIQUE/README.md"
            "docs/02_ARTIST_MANAGEMENT/README.md"
            "docs/03_SHARED_SERVICES/README.md"
            "docs/04_SYSTEMS/README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "All required CM operating-system files are present."
