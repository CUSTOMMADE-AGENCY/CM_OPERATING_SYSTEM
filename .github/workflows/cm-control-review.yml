name: CM CONTROL Review

# CM CONTROL GitHub Action v1 — operationaliseert de sectie "CM CONTROL GitHub
# Activation" uit docs/05_OPERATIONS/AUTOMATIONS/CM_AGENT_ACTIVATION_STRATEGY.md (v1.1).
#
# CM CONTROL voert een governance-review uit op een PR of issue en schrijft het
# verdict (GO / CONDITIONAL GO / REVIEW_REQUIRED / NO_GO) terug.
#
# PROVIDER:
#   - Default provider = GitHub Models (gratis, rate-limited) via de ingebouwde
#     GITHUB_TOKEN. Geen betaalde sleutel nodig. Zie .github/cm-control/config.json.
#   - Provider 'openai' (betaald, Responses API) vereist het secret OPENAI_API_KEY.
#
# VEILIGHEID / DORMANT-BY-DEFAULT:
#   - Draait alleen wanneer de repository-variabele CM_CONTROL_REVIEW_ENABLED == 'true'.
#     Met de default provider is dat de enige activatiestap; mergen doet zonder die
#     variabele niets.
#   - Mergt niet, pusht niet en muteert geen bestanden. Alleen reviews (comment,
#     optioneel label / commit-status / COMMENT-review). Niet-blokkerend by default.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, review_requested]
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      target_number:
        description: PR- of issue-nummer om handmatig te reviewen
        required: true

# Alleen wat nodig is om een review terug te schrijven. Bewust GEEN contents: write.
# models: read geeft gratis toegang tot GitHub Models via de ingebouwde GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  models: read

concurrency:
  group: cm-control-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.target_number }}
  cancel-in-progress: true

jobs:
  cm-control-review:
    name: CM CONTROL governance review
    runs-on: ubuntu-latest
    # Enable-gate: dormant tot de variabele bewust op 'true' staat.
    if: vars.CM_CONTROL_REVIEW_ENABLED == 'true'
    steps:
      # Governance-context (regels, prompt, config, script) uit de BASE-ref laden,
      # zodat een PR de maatstaf waarop hij beoordeeld wordt niet zelf kan wijzigen.
      - name: Checkout governance context (base ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CM CONTROL review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CM_CONTROL_MODEL: ${{ vars.CM_CONTROL_MODEL }}
          # pull_request | issues | workflow_dispatch → normaliseren naar type + nummer.
          TARGET_TYPE: ${{ github.event_name == 'issues' && 'issue' || 'pull_request' }}
          TARGET_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.target_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/cm-control/review.mjs
